# BEAM worker TCP tuning — enable BBR for better single-connection throughput
# on high-BDP paths (cross-region S3/R2 relay).
#
# Install (once per worker host):
#   sudo cp deploy/sysctl/99-beam-worker-tcp.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Verify:
#   sysctl net.ipv4.tcp_congestion_control
#   sysctl net.core.default_qdisc
#
# Requires Linux 4.9+ with the tcp_bbr module (standard on Ubuntu 22.04+).

net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# Raise socket buffers for fast links with non-trivial RTT (optional but helpful).
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
